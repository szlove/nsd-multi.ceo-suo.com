## 자주 묻는 질문 데이터. 문항 4개(위치·영업시간·연락 방법·가격대), 템플릿은 layouts/home.html에서 순회한다.

[[items]]
question = "비노는 어느 지역에 있나요?"
answer = "비노는 서울 관악구 봉천동, 낙성대 인근에서 영업하는 다국적노래방입니다."

[[items]]
question = "비노 영업시간이 어떻게 되나요?"
answer = "영업시간은 매일 18:00부터 다음날 15:00까지입니다. 국가공휴일에는 운영시간이 조정될 수 있습니다."

[[items]]
question = "비노에 문의하려면 어디로 연락해야 하나요?"
answer = "연락은 전화 010-7456-5410, 텔레그램 ggyuvely로 가능합니다."

[[items]]
question = "비노 이용 가격이 궁금합니다"
answer = "요금은 010-7456-5410으로 안내합니다."
