  author = '비노'
  datePublished = "2026-08-18T09:16:00+09:00"
  dateModified = "2026-08-18T09:16:00+09:00"
  [params.store]
	tel = "010-7456-5410"
  location = "낙성대"
	locationEn = "NSD"
  name = "비노"
	nameEn = "VINO"
	nameIs = "는"
	category = "다국적노래방"
	categoryEn = "Multi-KTV"
	categoryIs = "는"
	address = "서울 관악구 봉천동"
	googleMapSrc = "https://www.google.com/maps?q=서울+관악구+봉천동&output=embed"

enableRobotsTXT = false
cleanDestinationDir = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
